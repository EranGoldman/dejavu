# DejaVu Nginx Configuration
# Sample configuration for production deployment

upstream dejavu_backend {
    server 127.0.0.1:5000;
}

server {
    listen 80;
    server_name dejavu.example.com;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dejavu.example.com;
    
    # SSL Configuration
    ssl_certificate /etc/ssl/certs/dejavu.crt;
    ssl_certificate_key /etc/ssl/private/dejavu.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    
    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Frontend - Static Files
    location / {
        root /var/www/dejavu/frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    
    # Backend API
    location /api/ {
        proxy_pass http://dejavu_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (if needed)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Static assets with caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js)$ {
        root /var/www/dejavu/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Image uploads size limit
    client_max_body_size 10M;
    
    # Logs
    access_log /var/log/nginx/dejavu-access.log;
    error_log /var/log/nginx/dejavu-error.log;
}
